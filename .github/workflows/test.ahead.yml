name: Test (ahead)

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create destination branch one commit behind
        run: git push origin HEAD^:refs/heads/test/destination-ahead-${{ github.run_id }}

      - name: Run action
        id: check
        uses: ./
        with:
          source-branch: ${{ github.ref_name }}
          destination-branch: test/destination-ahead-${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert status is ahead
        run: |
          if [ "${{ steps.check.outputs.status }}" != "ahead" ]; then
            echo "Expected 'ahead', got '${{ steps.check.outputs.status }}'"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: git push origin --delete test/destination-ahead-${{ github.run_id }}
