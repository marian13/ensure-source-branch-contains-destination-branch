##
# TODO: Clarify Marketplace guideline "repository must not contain any workflow files" — does it apply to test workflows too?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
#
# NOTE: This workflow can NOT be run locally via `act` — it requires pushing branches to GitHub.
# - https://github.com/nektos/act
##

name: Test (behind)

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    name: Test (behind)
    runs-on: ubuntu-latest
    steps:
      ##
      # NOTE: `fetch-depth: 0` is not needed here — the destination branch is created from a fresh empty commit on top of HEAD, so no prior history is required.
      # - https://github.com/actions/checkout?tab=readme-ov-file#usage
      #
      - name: Checkout
        uses: actions/checkout@v7

      ##
      # NOTE: `>> $GITHUB_ENV` sets an environment variable that persists across all subsequent steps in the job.
      # - https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-environment-variable
      #
      - name: Set destination branch
        run: echo "DESTINATION_BRANCH=test/destination-behind-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Configure git user
        run: |
          git config user.email "marian13@example.com"
          git config user.name "Marian13"

      ##
      # NOTE: `git checkout -` switches back to previous branch.
      # - https://stackoverflow.com/a/56770029/12201472
      # - https://git-scm.com/docs/git-checkout#Documentation/git-checkout.txt-branch
      #
      - name: Create destination branch one commit ahead
        run: |
          git checkout -b $DESTINATION_BRANCH
          git commit --allow-empty -m "extra commit"
          git push origin $DESTINATION_BRANCH
          git checkout -

      - name: Run action
        id: check
        continue-on-error: true
        uses: ./
        with:
          destination-branch: ${{ env.DESTINATION_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert status is behind
        run: |
          if [ "${{ steps.check.outputs.status }}" != "behind" ]; then
            echo "Expected 'behind', got '${{ steps.check.outputs.status }}'"

            exit 1
          fi

      - name: Cleanup
        if: always()
        run: git push origin --delete $DESTINATION_BRANCH || true
