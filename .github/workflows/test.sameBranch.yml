##
# TODO: Clarify Marketplace guideline "repository must not contain any workflow files" — does it apply to test workflows too?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
#
# NOTE: This workflow can NOT be run locally via `act` — it requires pushing branches to GitHub.
# - https://github.com/nektos/act
##

name: Test (sameBranch)

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test (sameBranch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run action
        id: check
        uses: ./
        with:
          source-branch: ${{ github.ref_name }}
          destination-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert status is sameBranch
        run: |
          if [ "${{ steps.check.outputs.status }}" != "sameBranch" ]; then
            echo "Expected 'sameBranch', got '${{ steps.check.outputs.status }}'"

            exit 1
          fi
