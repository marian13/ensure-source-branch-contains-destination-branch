##
# TODO: "Each repository must not contain any workflow files." - This guideline is unclear, how test workflow can be run by end-user? Does this mean custom GitHub Action literally can NOT contain workflow files just for its ownn testign purposes?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
#
#
# NOTE: This workflow can NOT be run locally via `act` since it requires SSH agent forwarding to push branches to GitHub. There is not simple way to do it. At least for the moment when this workflow was created.
# - https://github.com/nektos/act
##

name: Test (diverged)

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    name: Test (diverged)
    runs-on: ubuntu-latest
    steps:
      ##
      # NOTE: `fetch-depth: 0` fetches the full git history. Required here because `HEAD^` must exist to create a diverged branch from the previous commit.
      # - https://github.com/actions/checkout?tab=readme-ov-file#usage
      #
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      ##
      # NOTE: `>> $GITHUB_ENV` sets an environment variable that persists across all subsequent steps in the job.
      # - https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-environment-variable
      #
      - name: Set destination branch
        run: echo "DESTINATION_BRANCH=test/destination-diverged-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Configure git user
        run: |
          git config user.email "marian13@example.com"
          git config user.name "Marian13"

      ##
      # NOTE: `git checkout -` switches back to previous branch.
      # NOTE: `HEAD^` requires at least two commits in the repo. This is not a practical concern — it would only fail if all existing commits were squashed into one, which is an unusual destructive operation on an active repo.
      # IMPORTANT: `git push origin $DESTINATION_BRANCH` pushes a branch created from `HEAD^`. This requires only `contents: write` as long as `HEAD^` does not introduce new or modified workflow files compared to what is already on GitHub. If it does, GitHub will reject the push with a permission error. In that case, push a follow-up commit without workflow file changes to re-trigger this workflow.
      # - https://stackoverflow.com/a/56770029/12201472
      # - https://git-scm.com/docs/git-checkout#Documentation/git-checkout.txt-branch
      #
      - name: Create diverged destination branch
        run: |
          git checkout -b $DESTINATION_BRANCH HEAD^
          git commit --allow-empty -m "diverged commit"
          git push origin $DESTINATION_BRANCH
          git checkout -

      - name: Run action
        id: check
        continue-on-error: true
        uses: ./
        with:
          source-branch: ${{ github.ref_name }}
          destination-branch: ${{ env.DESTINATION_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert status is diverged
        run: |
          if [ "${{ steps.check.outputs.status }}" != "diverged" ]; then
            echo "Expected 'diverged', got '${{ steps.check.outputs.status }}'"

            exit 1
          fi

      - name: Cleanup
        if: always()
        run: git push origin --delete $DESTINATION_BRANCH || true
