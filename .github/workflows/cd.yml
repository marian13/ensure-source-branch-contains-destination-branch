##
# TODO: "Each repository must not contain any workflow files." - This guideline is unclear, how test workflow can be run by end-user? Does this mean custom GitHub Action literally can NOT contain workflow files just for its ownn testign purposes?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
##

name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ##
  # NOTE: In order to publish to GitHub
  #
  create_github_release:
    runs-on: ubuntu-24.04
    name: Create GitHub Release PR
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          changelog-path: CHANGELOG.md
          default-branch: main
          include-v-in-tag: true
          package-name: ensure-source-branch-contains-destination-branch
          release-type: node
          version-file: package.json

      ##
      # NOTE: Checkout is required to push the updated floating tag back to the remote.
      # NOTE: The floating `v1` tag always points to the latest `1.x` release, so users pinned to `@v1` get updates automatically.
      #
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: Update floating v1 tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git tag -f v1 ${{ steps.release.outputs.sha }}
          git push origin v1 --force
