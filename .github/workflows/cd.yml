##
# TODO: Clarify Marketplace guideline "repository must not contain any workflow files" — does it apply to test workflows too?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
##

name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create_github_release:
    runs-on: ubuntu-24.04
    name: Create GitHub Release PR
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node
          target-branch: main

      ##
      # NOTE: Checkout is required to push the updated floating tag back to the remote.
      # NOTE: The floating `v1` tag always points to the latest `1.x` release, so users pinned to `@v1` get updates automatically.
      #
      - name: Checkout
        uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: Update floating v1 tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git tag -f v1 ${{ steps.release.outputs.sha }}
          git push origin v1 --force
