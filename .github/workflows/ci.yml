# TODO: Clarify Marketplace guideline "repository must not contain any workflow files" — does it apply to test workflows too?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
##

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify formatting
        run: npm run format:verify
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Verify build
        run: npm run build:verify
