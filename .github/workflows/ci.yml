# TODO: "Each repository must not contain any workflow files." - This guideline is unclear, how test workflow can be run by end-user? Does this mean custom GitHub Action literally can NOT contain workflow files just for its ownn testign purposes?
# - https://docs.github.com/en/actions/how-tos/create-and-publish-actions/publish-in-github-marketplace
##

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm test
