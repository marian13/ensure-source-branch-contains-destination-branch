name: Ensure Source Contains Destination Branch
description: Verifies that the source branch contains all commits from the destination branch (e.g. main), preventing out-of-date merges.

inputs:
  ##
  # NOTE: Defaults are resolved in JavaScript (index.js) rather than here.
  # NOTE: action.yml expression language only supports `||` fallbacks with no conditionals, making it impossible to correctly handle all event types (push, pull_request, merge_group, etc.) in a single expression.
  # NOTE: JavaScript has full access to the event payload and can branch on event type, producing the correct value for every case.
  #
  source-branch:
    description: The branch to check (defaults to the branch that triggered the workflow).
    required: false
  destination-branch:
    description: The branch that must be contained in the source branch (defaults to the repo default branch).
    required: false
  token:
    description: GitHub token used to call the SHA API and the Compare API.
    required: false
    default: ${{ github.token }}
  tag:
    description: Tag prepended to log messages (e.g. "[my-tag] message"). Set to '' to log without a tag.
    required: false
    default: ensure-source-branch-contains-destination-branch

outputs:
  status:
    description: Result of the branch comparison (sameBranch, ahead, identical, behind, diverged, shaApiError, compareApiError, unknownStatus, unexpectedException).

branding:
  icon: git-merge
  color: blue

runs:
  using: node24
  main: dist/index.js
