name: Ensure Source Contains Destination Branch
description: Verifies that the source branch contains all commits from the destination branch (e.g. main), preventing out-of-date merges.

inputs:
  source-branch:
    description: The branch to check (defaults to the branch that triggered the workflow).
    required: false
    default: ${{ github.ref_name }}
  destination-branch:
    description: The branch that must be contained in the source branch (defaults to the repo default branch).
    required: false
    default: ${{ github.event.repository.default_branch }}
  token:
    description: GitHub token used to call the Compare API.
    required: false
    default: ${{ github.token }}
  tag:
    description: Tag prepended to log messages (e.g. "[my-tag] message"). Omit to log without a tag.
    required: false
    default: ensure-source-branch-contains-destination-branch

outputs:
  status:
    description: Result of the branch comparison (sameBranch, ahead, identical, behind, diverged, shaApiError, compareApiError, unknownStatus, unexpectedException).

runs:
  using: node22
  main: dist/index.js
